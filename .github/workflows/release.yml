# SPDX-License-Identifier: MIT
# Build release binaries, generate a CycloneDX SBOM, sign each payload with keyless cosign,
# and attach the files to the GitHub release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, sign, and release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/uptimefoundry_${GOOS}_${GOARCH}" ./cmd/uptimefoundry
          go build -trimpath -o "dist/uptimefoundry-cli_${GOOS}_${GOARCH}" ./cmd/uptimefoundry-cli
          go build -trimpath -o "dist/uptimefoundry-agent_${GOOS}_${GOARCH}" ./cmd/uptimefoundry-agent
          go build -trimpath -o "dist/uptimefoundry-agentctl_${GOOS}_${GOARCH}" ./cmd/uptimefoundry-agentctl
          go build -trimpath -o "dist/uptimefoundry-agent-actuator_${GOOS}_${GOARCH}" ./cmd/uptimefoundry-agent-actuator

      - name: Generate CycloneDX SBOM
        env:
          UPTIMEFOUNDRY_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go run scripts/generate-sbom.go > "dist/sbom_${{ matrix.goos }}_${{ matrix.goarch }}.cdx.json"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum uptimefoundry_* sbom_*.cdx.json > "checksums_${{ matrix.goos }}_${{ matrix.goarch }}.txt"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign release payloads with keyless cosign
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for file in dist/uptimefoundry_* dist/sbom_*.cdx.json dist/checksums_*.txt; do
            cosign sign-blob --yes --output-signature "${file}.sig" --output-certificate "${file}.pem" "${file}"
          done

      - name: Upload release artifacts
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.2.1
        with:
          files: dist/*
          generate_release_notes: true
