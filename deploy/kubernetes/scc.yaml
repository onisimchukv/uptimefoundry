# SPDX-License-Identifier: MIT

apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: uptimefoundry-agent-scc
  labels:
    app.kubernetes.io/name: uptimefoundry-agent
    app.kubernetes.io/part-of: uptimefoundry
allowHostDirVolumePlugin: true
allowHostIPC: false
allowHostNetwork: true
allowHostPID: true
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities:
  - BPF
  - PERFMON
  - SYS_PTRACE
  - NET_ADMIN
defaultAddCapabilities: []
requiredDropCapabilities:
  - ALL
readOnlyRootFilesystem: true
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
users:
  - system:serviceaccount:uptimefoundry-system:uptimefoundry-agent
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - hostPath
  - projected
