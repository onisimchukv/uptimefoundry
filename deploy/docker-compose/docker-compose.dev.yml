# UptimeFoundry Development Stack (PostgreSQL 16 + Apache AGE + pgvector, VictoriaMetrics, Loki)
#
# WARNING: THIS COMPOSE CONFIGURATION IS STRICTLY FOR LOCAL DEVELOPMENT AND TESTING.
# DO NOT USE THIS CONFIGURATION IN PRODUCTION OR EXPOSE THESE PORTS TO PUBLIC NETWORKS.

services:
  postgres:
    build:
      context: .
      dockerfile: Containerfile.postgres
    image: uptimefoundry/postgres-age-vector:16
    container_name: uptimefoundry-postgres
    environment:
      POSTGRES_USER: opsfoundry
      POSTGRES_PASSWORD: ${UPTIMEFOUNDRY_DEV_DB_PASSWORD:?Set UPTIMEFOUNDRY_DEV_DB_PASSWORD to a local-only development password}
      POSTGRES_DB: opsfoundry
    # Bind strictly to loopback interface (127.0.0.1) to prevent unintended external exposure
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsfoundry -d opsfoundry"]
      interval: 5s
      timeout: 5s
      retries: 5

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.104.0
    container_name: uptimefoundry-victoriametrics
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - vmdata:/victoria-metrics-data
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=14d"
      - "-httpListenAddr=0.0.0.0:8428"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  loki:
    image: grafana/loki:3.2.0
    container_name: uptimefoundry-loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - lokidata:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
  vmdata:
  lokidata:
